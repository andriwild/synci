services:
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      monitoring-net:
      synci-net-dev:
      synci-net-prod:


  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=synci-observer
      - GF_SERVER_ROOT_URL=https://synci.ch/dashboard/
      - GF_SERVER_SERVE_FROM_SUBPATH=true
    networks:
      monitoring-net:
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  grafana-data:

networks:
  monitoring-net:
    name: 'monitoring-net'

  synci-net-dev:
    external: true

  synci-net-prod:
    external: true
