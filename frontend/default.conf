server {
 listen 5173;
 server_name _;
 root /usr/share/nginx/html;
 index index.html index.htm;
location / {
 try_files $uri $uri/ /index.html =404;
 }
# Runtime config and the page that references the hashed bundles must never be stale
location = /config.js {
 add_header Cache-Control "no-store";
 }
location = /index.html {
 add_header Cache-Control "no-cache";
 }
}
